site_name: quant-backtest-engine
site_description: Independent Rust backtest engine backed by NautilusTrader
site_url: https://runchengxie.github.io/quant-backtest-engine/
repo_name: runchengxie/quant-backtest-engine
repo_url: https://github.com/runchengxie/quant-backtest-engine
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search:
      lang: [en, zh]
hooks:
  - project_tools/docs_locale.py
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
exclude_docs: |
  requirements/
  superpowers/
nav:
  - English:
      - Overview: index.md
      - Quick start: quickstart.md
      - Target-weight walkthrough: tutorial.md
      - Capabilities and compatibility: capabilities.md
      - Correctness evidence: correctness.md
      - Batch benchmarks: benchmarks.md
      - Releases: releases.md
      - Request and result contracts: contracts.md
      - Execution assumptions: execution.md
      - Target-weight planning: sizing.md
      - Session ledger and rules: sessions.md
      - Reusable product ownership: migration/reusable-product.md
      - Migration limits: migration/corporate-action-conformance.md
      - Product contracts: product/contracts.md
      - Product installation: product/installation.md
      - Product backends: product/backends.md
      - Daily inputs: product/daily-inputs.md
      - Daily execution scope: guides/execution-simulation.md
      - Financial recovery: product/recovery.md
      - Independent scenarios: product/scenarios.md
      - Impact-aware planning: concepts/impact-planning.md
      - Finite inventory: concepts/discrete-inventory.md
      - Impact and discrete scenarios: concepts/impact-optimization-scenarios.md
      - Shared sleeve allocation: backtest/sleeve-allocation.md
      - Capital and reconciliation boundary: backtest/capital-and-reconciliation.md
      - Synthetic market paths: backtest/market-paths.md
      - Transaction cost evidence: backtest/transaction-cost-evidence.md
      - Recorded-fill integrity: backtest/execution-integrity.md
      - Cost evidence: backtest/cost-evidence.md
      - Minute sessions: backtest/minute-session.md
      - Minute execution: guides/minute-execution.md
      - LOB matching: microstructure/matching.md
      - LOB replay: microstructure/replay.md
      - Execution impact: microstructure/impact-estimation.md
