version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      nautilus:
        patterns:
          - "nautilus-*"
      nautilus-security:
        applies-to: security-updates
        patterns:
          - "nautilus-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
