name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python3 -m unittest discover -s project_tools -p test_profile_workload.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- run fixtures/roundtrip.json
      - name: Synthetic target-weight walkthrough
        run: python3 project_tools/tutorial.py --engine "$PWD/target/debug/quant-backtest-engine" --output "$RUNNER_TEMP/tutorial"
      - run: git diff --check

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python -m pip wheel --no-deps ./python --wheel-dir "$RUNNER_TEMP/wheels"
      - run: python -m venv "$RUNNER_TEMP/sdk-env"
      - run: '"$RUNNER_TEMP/sdk-env/bin/pip" install --no-deps "$RUNNER_TEMP"/wheels/*.whl'
      - name: Test installed SDK without platform packages
        working-directory: /tmp
        run: '"$RUNNER_TEMP/sdk-env/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/python/tests"'
      - run: cargo build --locked
      - name: Test installed SDK against real engine
        working-directory: /tmp
        env:
          QUANT_ENGINE_BINARY: ${{ github.workspace }}/target/debug/quant-backtest-engine
        run: '"$RUNNER_TEMP/sdk-env/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/python/tests"'
