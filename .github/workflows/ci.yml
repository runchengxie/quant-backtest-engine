name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- run fixtures/roundtrip.json
      - name: Synthetic target-weight walkthrough
        run: python3 project_tools/tutorial.py --engine "$PWD/target/debug/quant-backtest-engine" --output "$RUNNER_TEMP/tutorial"
      - run: git diff --check
