name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python3 -m unittest discover -s project_tools -p test_profile_workload.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- run fixtures/roundtrip.json
      - name: Synthetic target-weight walkthrough
        run: python3 project_tools/tutorial.py --engine "$PWD/target/debug/quant-backtest-engine" --output "$RUNNER_TEMP/tutorial"
      - run: git diff --check

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python -m pip wheel --no-deps ./python --wheel-dir "$RUNNER_TEMP/wheels"
      - run: python -m venv "$RUNNER_TEMP/sdk-env"
      - run: '"$RUNNER_TEMP/sdk-env/bin/pip" install --no-deps "$RUNNER_TEMP"/wheels/*.whl'
      - name: Test installed SDK without platform packages
        working-directory: /tmp
        run: '"$RUNNER_TEMP/sdk-env/bin/python" -I -B -m unittest discover -s "$GITHUB_WORKSPACE/python/tests"'
      - run: '"$RUNNER_TEMP/sdk-env/bin/python" -I -B project_tools/verify_installed_product.py --mode sdk'
      - run: cargo build --locked
      - name: Test installed SDK against real engine
        working-directory: /tmp
        env:
          QUANT_ENGINE_BINARY: ${{ github.workspace }}/target/debug/quant-backtest-engine
        run: '"$RUNNER_TEMP/sdk-env/bin/python" -I -B -m unittest discover -s "$GITHUB_WORKSPACE/python/tests"'

  python-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/core-dev
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
      MYPY_CACHE_DIR: ${{ runner.temp }}/mypy-cache
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
      CARGO_TARGET_DIR: ${{ runner.temp }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv python install "${{ matrix.python }}"
      - run: uv sync --project core --locked --no-editable --extra minute --extra cost --extra scenario --python "${{ matrix.python }}"
      - run: '"$UV_PROJECT_ENVIRONMENT/bin/ruff" check core'
      - run: '"$UV_PROJECT_ENVIRONMENT/bin/ruff" format --check core'
      - run: '"$UV_PROJECT_ENVIRONMENT/bin/mypy" --config-file core/pyproject.toml core/src'
      - run: uv build --wheel --project python --out-dir "$RUNNER_TEMP/wheels"
      - run: uv build --wheel --project core --out-dir "$RUNNER_TEMP/wheels"
      - run: uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/core-base"
      - run: uv pip install --python "$RUNNER_TEMP/core-base/bin/python" --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - run: '"$RUNNER_TEMP/core-base/bin/python" -I -B project_tools/verify_installed_product.py --mode base'
      - run: cargo build --locked
      - name: Installed Rust adapter and regression suite
        env:
          QUANT_ENGINE_BINARY: ${{ runner.temp }}/target/debug/quant-backtest-engine
        run: |
          for suite in packaging runner rust_adapter; do
            "$RUNNER_TEMP/core-base/bin/python" -I -B -m unittest discover -s core/tests -p "test_$suite.py" -v
          done
          "$RUNNER_TEMP/core-base/bin/python" -I -B -m unittest discover -s python/tests -v
      - name: Installed minute, cost and scenario suites
        env:
          QUANT_ENGINE_BINARY: ${{ runner.temp }}/target/debug/quant-backtest-engine
        run: |
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B -m pytest core/tests -q -p no:cacheprovider
      - name: Minimal installed minute recovery acceptance
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/core-minute"
          uv pip install --python "$RUNNER_TEMP/core-minute/bin/python" "$RUNNER_TEMP/wheels/quant_backtest_core-0.1.0-py3-none-any.whl[minute]" "$RUNNER_TEMP/wheels/quant_backtest_engine_client-0.3.0-py3-none-any.whl" numpy==2.2.6 pandas==3.0.6
          "$RUNNER_TEMP/core-minute/bin/python" -I -B project_tools/verify_installed_product.py --mode minute --manifest fixtures/product/minute-session.json --artifact-root fixtures/product --output-root "$RUNNER_TEMP/minute-output"
      - name: Installed synthetic minute example
        run: '"$UV_PROJECT_ENVIRONMENT/bin/python" -I -B examples/product/minute_session.py'
      - name: Installed CLI acceptance
        run: |
          ENGINE="$CARGO_TARGET_DIR/debug/quant-backtest-engine"
          DIGEST=$(sha256sum "$ENGINE" | cut -d ' ' -f 1)
          "$RUNNER_TEMP/core-base/bin/python" -I -B project_tools/verify_installed_product.py --mode rust --manifest fixtures/product/rust-session.json --artifact-root fixtures/product --output-root "$RUNNER_TEMP/product-output" --rust-executable "$ENGINE" --rust-sha256 "$DIGEST"
          "$RUNNER_TEMP/core-base/bin/quant-backtest" capabilities rust.nautilus.sessions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-wheels-python-${{ matrix.python }}
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error
