name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set isolated site paths
        run: |
          echo "TASK_DATA=$RUNNER_TEMP/engine-site" >> "$GITHUB_ENV"
          echo "ASTRO_CACHE_DIR=$RUNNER_TEMP/engine-site/astro-cache" >> "$GITHUB_ENV"
          echo "SITE_INPUT_DIR=$RUNNER_TEMP/engine-site/reference-home" >> "$GITHUB_ENV"
          echo "ASTRO_OUT_DIR=$RUNNER_TEMP/engine-site/site-astro" >> "$GITHUB_ENV"
          echo "BROWSER_OUTPUT_DIR=$RUNNER_TEMP/engine-site/browser" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/engine-site/browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Install locked docs and frontend tools outside source
        run: |
          npm install --global npm@12.2.2
          mkdir -p "$TASK_DATA/web-deps" "$TASK_DATA/method-dom" "$TASK_DATA/web-generated"
          uv venv --python 3.13 "$TASK_DATA/docs-env"
          uv pip sync --python "$TASK_DATA/docs-env/bin/python" docs/requirements/docs.lock docs/requirements/learning.lock --require-hashes
          cp apps/docs/package*.json "$TASK_DATA/web-deps/"
          npm ci --prefix "$TASK_DATA/web-deps" --no-audit --no-fund
          ln -s "$TASK_DATA/web-deps/node_modules" apps/docs/node_modules
          node scripts/build/frontend_security.cjs patch apps/docs
          node --test scripts/build/test_frontend_security.cjs
          ln -s "$TASK_DATA/web-deps/node_modules" "$TASK_DATA/node_modules"
          ln -s "$TASK_DATA/web-generated" apps/docs/.astro
          cp scripts/build/method-tests/package*.json "$TASK_DATA/method-dom/"
          npm ci --prefix "$TASK_DATA/method-dom" --ignore-scripts --no-audit --no-fund
          apps/docs/node_modules/.bin/playwright install --with-deps chromium
          test "$(npm --version)" = 12.2.2
      - name: Preserve ownership, fixture and legacy replay gates
        run: |
          "$TASK_DATA/docs-env/bin/python" -m unittest scripts.verify.test_reusable_ownership -v
          "$TASK_DATA/docs-env/bin/python" scripts/verify/check_reusable_ownership.py
          "$TASK_DATA/docs-env/bin/python" -m unittest discover -s scripts/build -p 'test_method_*.py'
          node --test scripts/build/test_method_replay.cjs
          NODE_PATH="$TASK_DATA/method-dom/node_modules" node --test scripts/build/test_method_dom.cjs
      - name: Validate exact assets, route assembly and shared replay state
        run: |
          "$TASK_DATA/docs-env/bin/python" -m unittest scripts.verify.test_deployed_site scripts.build.test_site_routes scripts.build.test_reference_home scripts.build.test_prepare_reference scripts.build.test_site_assembly scripts.build.test_learning_assets scripts.build.test_export_opportunity_example scripts.build.test_event_demo -v
          "$TASK_DATA/docs-env/bin/python" scripts/build/validate_learning_assets.py --manifest docs/assets/learning/manifest.json
          "$TASK_DATA/docs-env/bin/python" scripts/build/export_event_demo.py --check
          npm --prefix apps/docs run check
          npm --prefix apps/docs run test:unit
          FRONTEND_AUDIT_RECEIPT="$TASK_DATA/frontend-audit.json" npm --prefix apps/docs run audit:locked
      - name: Build one Astro-owned artifact
        run: |
          "$TASK_DATA/docs-env/bin/python" scripts/build/prepare_reference.py --output "$SITE_INPUT_DIR"
          npm --prefix apps/docs run build
          "$TASK_DATA/docs-env/bin/python" scripts/build/assemble_site.py --astro "$ASTRO_OUT_DIR" --learning docs/assets/learning --routes docs/site/route-ownership.json --output "$TASK_DATA/site-assembled"
          "$TASK_DATA/docs-env/bin/python" scripts/verify/check_docs.py --site-dir "$TASK_DATA/site-assembled"
          "$TASK_DATA/docs-env/bin/python" scripts/verify/check_assembled_site.py --site-dir "$TASK_DATA/site-assembled" --base /quant-backtest-engine/ --legacy docs/site/legacy-route-anchors.json
      - name: Real built-site browser acceptance
        run: SITE_DIR="$TASK_DATA/site-assembled" SITE_BASE=/quant-backtest-engine/ npm --prefix apps/docs run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/engine-site/site-assembled
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
