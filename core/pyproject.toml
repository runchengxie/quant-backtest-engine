[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "quant-backtest-core"
version = "0.2.0"
description = "Explicit optional backtest product runner and Rust session adapter"
requires-python = ">=3.12,<3.14"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING", "THIRD_PARTY_NOTICES.md", "licenses/quant-platform-Apache-2.0.txt"]
dependencies = ["quant-backtest-engine-client>=0.3.0,<0.4"]

[project.scripts]
quant-backtest = "quant_backtest_core.cli:main"

[project.optional-dependencies]
minute = ["pandas>=3.0.5,<3.1"]
scenario = ["pandas>=3.0.5,<3.1"]
planning = ["numpy>=1.23", "pandas>=3.0.5,<3.1", "scipy>=1.14"]
cost = ["pandas>=3.0.5,<3.1", "numpy>=1.23", "scipy>=1.14"]
microstructure = ["pandas>=3.0.5,<3.1", "numpy>=1.23"]
daily = ["pandas>=3.0.5,<3.1", "numpy>=1.23"]
all = ["pandas>=3.0.5,<3.1", "numpy>=1.23", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

# Preserve the numerical extraction baseline; dependency upgrades require separate parity evidence.
[tool.uv]
constraint-dependencies = ["numpy==2.2.6", "pandas==3.0.6", "scipy==1.18.1"]

[tool.uv.sources]
quant-backtest-engine-client = { path = "../python" }

[tool.hatch.build.targets.wheel]
packages = ["src/quant_backtest_core"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["quant_backtest_core"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "quant_backtest_engine.*"
follow_untyped_imports = true

# Retain extracted legacy signatures while checking their function bodies.
[[tool.mypy.overrides]]
module = [
    "quant_backtest_core.backtest.minute",
    "quant_backtest_core.backtest.minute_session",
    "quant_backtest_core.backtest._minute_checkpoint",
    "quant_backtest_core.backtest.quantity_locks",
    "quant_backtest_core._minute.minute_execution",
    "quant_backtest_core._minute._minute_state",
    "quant_backtest_core._minute._minute_validation",
    "quant_backtest_core._minute.capital_flows",
    "quant_backtest_core._minute.corporate_actions",
    "quant_backtest_core._minute.valuation_events",
    "quant_backtest_core.backtest.market_paths",
    "quant_backtest_core.backtest.stress",
    "quant_backtest_core.backtest.costs",
    "quant_backtest_core.backtest.impact",
    "quant_backtest_core.backtest.impact_scenarios",
    "quant_backtest_core.evidence._exact",
    "quant_backtest_core.evidence.execution_integrity",
    "quant_backtest_core.evidence.transaction_costs",
    "quant_backtest_core.evidence.cost_scope",
    "quant_backtest_core.evidence.capital_returns",
]
disallow_untyped_defs = false


# Original numerical modules lack third-party stubs; body checking remains enabled.
[[tool.mypy.overrides]]
module = [
    "quant_backtest_core.backtest.market_paths",
    "quant_backtest_core.backtest.stress",
    "quant_backtest_core.evidence.cost_scope",
]
disable_error_code = ["import-untyped"]

# Retain the original audit dictionary inference without rewriting its signatures.
[[tool.mypy.overrides]]
module = "quant_backtest_core.evidence.transaction_costs"
disable_error_code = ["import-untyped", "var-annotated"]

# Preserved minute legacy modules: pandas has no installed stubs; bodies stay checked.
[[tool.mypy.overrides]]
module = [
    "quant_backtest_core._minute._minute_state",
    "quant_backtest_core._minute._minute_validation",
    "quant_backtest_core._minute.valuation_events",
    "quant_backtest_core._minute.corporate_actions",
    "quant_backtest_core._minute.capital_flows",
    "quant_backtest_core.backtest._minute_checkpoint",
    "quant_backtest_core.backtest.minute_session",
]
disable_error_code = ["import-untyped"]

# Preserve original decisions/scheduled/groups dictionary inference during transfer.
[[tool.mypy.overrides]]
module = "quant_backtest_core._minute.minute_execution"
disable_error_code = ["import-untyped", "var-annotated"]

[[tool.mypy.overrides]]
module = "_microstructure_rs"
ignore_missing_imports = true

# Task 9 retains original untyped account/reservation signatures; bodies stay checked.
[[tool.mypy.overrides]]
module = [
    "quant_backtest_core.backtest.paper_account",
    "quant_backtest_core.backtest.account_events",
    "quant_backtest_core.backtest.checkpoints",
    "quant_backtest_core.backtest.reconciliation",
    "quant_backtest_core.planning.pending_allocation",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "quant_backtest_core.backtest.paper_account",
    "quant_backtest_core.backtest.account_events",
    "quant_backtest_core.planning.pending_allocation",
    "quant_backtest_core.planning.pending_protocol",
]
disable_error_code = ["import-untyped"]

# Task 10 preserves original planning signatures and checks their function bodies.
[[tool.mypy.overrides]]
module = [
    "quant_backtest_core.planning.impact_planning",
    "quant_backtest_core.planning.multiperiod",
    "quant_backtest_core.planning.discrete_inventory",
    "quant_backtest_core.planning.discrete_oracle",
    "quant_backtest_core.planning.sleeve_allocation",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "quant_backtest_core.planning.multiperiod"
disable_error_code = ["import-untyped"]

# Preserve the existing NumPy norm/max expression and untyped dictionary inference.
[[tool.mypy.overrides]]
module = "quant_backtest_core.planning.impact_planning"
disable_error_code = ["import-untyped", "operator"]

[[tool.mypy.overrides]]
module = "quant_backtest_core.planning.sleeve_allocation"
disable_error_code = ["var-annotated"]
